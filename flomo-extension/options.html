<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flomo 智能助手 - 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .subtitle {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid #ecf0f1;
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #3498db;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .checkbox-group input[type="checkbox"] {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
      font-weight: normal;
    }

    .help-text {
      font-size: 13px;
      color: #7f8c8d;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
    }

    .btn-secondary {
      background: #ecf0f1;
      color: #555;
    }

    .btn-secondary:hover {
      background: #ddd;
    }

    .btn-success {
      background: #27ae60;
      color: white;
    }

    .btn-success:hover {
      background: #229954;
    }

    .status-message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-message.show {
      display: block;
    }

    .info-box {
      background: #e8f4f8;
      border-left: 4px solid #3498db;
      padding: 15px;
      margin-top: 15px;
      border-radius: 4px;
    }

    .info-box p {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #2c3e50;
    }

    .info-box a {
      color: #3498db;
      text-decoration: none;
    }

    .info-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Flomo 智能助手设置</h1>
    <p class="subtitle">配置你的 flomo API 和偏好设置</p>

    <!-- API 设置 -->
    <div class="section">
      <h2 class="section-title">API 设置</h2>
      <div class="form-group">
        <label for="apiToken">Flomo API Token *</label>
        <input type="password" id="apiToken" placeholder="请输入你的 flomo API token">
        <p class="help-text">在 flomo 设置中找到「API」，复制 webhook 地址中的 token 部分</p>
        <div class="info-box">
          <p>
            <strong>如何获取 API Token：</strong><br>
            1. 打开 <a href="https://flomoapp.com/mine" target="_blank">flomo 网页版</a><br>
            2. 点击右上角头像 → 设置 → API<br>
            3. 复制 webhook 地址中的最后一段（例如：https://flomoapp.com/iwh/<strong>xxxxxxxx</strong>）<br>
            4. 只需要复制 <strong>xxxxxxxx</strong> 这部分
          </p>
        </div>
      </div>
      <div class="button-group">
        <button id="testConnection" class="btn-success">测试连接</button>
      </div>
      <div id="connectionStatus" class="status-message"></div>
    </div>

    <!-- 功能设置 -->
    <div class="section">
      <h2 class="section-title">功能设置</h2>
      <div class="checkbox-group">
        <input type="checkbox" id="autoTag" checked>
        <label for="autoTag">自动推荐标签</label>
      </div>
      <p class="help-text">根据内容智能推荐相关标签</p>

      <div class="checkbox-group">
        <input type="checkbox" id="includeSource" checked>
        <label for="includeSource">包含来源链接</label>
      </div>
      <p class="help-text">在保存的内容中自动添加网页来源链接</p>
    </div>

    <!-- 保存按钮 -->
    <div class="button-group">
      <button id="saveSettings" class="btn-primary">保存设置</button>
      <button id="resetSettings" class="btn-secondary">重置为默认</button>
    </div>
    <div id="saveStatus" class="status-message"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
